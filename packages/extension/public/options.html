<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZiaSub</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="options.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
    />
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <div class="brand">
          <img src="icons/icon128.png" alt="ZiaSub" class="logo" />
          <div class="brand-text">
            <h1>ZiaSub</h1>
            <p data-i18n="extension.options.subtitleHint"></p>
          </div>
        </div>
        <div class="header-actions">
          <button
            class="icon-btn"
            id="openYoutubeBtn"
            data-i18n-title="extension.options.openYoutube"
          >
            <i class="mdi mdi-youtube"></i>
          </button>
          <button
            class="icon-btn danger"
            id="resetAllBtn"
            data-i18n-title="extension.options.resetAll"
          >
            <i class="mdi mdi-restore"></i>
          </button>
        </div>
      </header>

      <main class="layout">
        <section class="card preview-card">
          <div class="card-head">
            <div>
              <h2 data-i18n="settings.subtitle.previewTitle"></h2>
              <p data-i18n="settings.subtitle.previewDescription"></p>
            </div>
            <div class="segmented" id="previewMode">
              <button type="button" data-mode="portrait">
                <i class="mdi mdi-cellphone"></i>
                <span data-i18n="settings.subtitle.portrait"></span>
              </button>
              <button type="button" data-mode="landscape">
                <i class="mdi mdi-monitor"></i>
                <span data-i18n="settings.subtitle.landscape"></span>
              </button>
            </div>
          </div>
          <div class="preview-stage" id="previewStage">
            <div class="preview-backdrop"></div>
            <div class="preview-subtitle" id="previewSubtitle"></div>
          </div>
          <p class="hint" data-i18n="settings.subtitle.previewHint"></p>
        </section>

        <section class="card">
          <div class="card-head">
            <div>
              <h2 data-i18n="extension.options.general"></h2>
              <p data-i18n="extension.options.generalHint"></p>
            </div>
          </div>
          <div class="general-grid" id="generalGrid"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <div>
              <h2 data-i18n="settings.subtitle.presetsTitle"></h2>
              <p data-i18n="settings.subtitle.presetsDescription"></p>
            </div>
            <button class="text-btn" id="resetStyleBtn">
              <i class="mdi mdi-restore"></i>
              <span data-i18n="extension.options.resetStyle"></span>
            </button>
          </div>
          <div class="preset-grid" id="presetGrid"></div>
        </section>

        <div id="styleSections"></div>
      </main>

      <footer class="page-footer">
        <span>ZiaSub extension</span>
        <a href="https://github.com/PhuVinhAI/ZiaSub" target="_blank" rel="noreferrer">
          GitHub
        </a>
      </footer>
    </div>

    <div class="toast hidden" id="toast">
      <span id="toastMessage"></span>
    </div>

    <script src="dist/options/index.js" type="module"></script>
  </body>
</html>
