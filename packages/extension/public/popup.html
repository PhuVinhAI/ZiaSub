<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZiaSub</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
    />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="brand">
          <img src="icons/icon128.png" alt="ZiaSub" class="logo" />
          <div class="brand-text">
            <h1 class="title">ZiaSub</h1>
            <p class="subtitle" data-i18n="extension.popup.subtitleHint"></p>
          </div>
        </div>
        <div class="header-actions">
          <button
            class="icon-btn"
            id="aiStudioBtn"
            data-i18n-title="extension.popup.aiStudioTitle"
          >
            <i class="mdi mdi-creation"></i>
          </button>
          <button
            class="icon-btn"
            id="settingsBtn"
            data-i18n-title="settings.title"
          >
            <i class="mdi mdi-cog-outline"></i>
          </button>
        </div>
      </header>

      <main class="card">
        <div class="card-head">
          <h2 data-i18n="extension.popup.subtitleTitle"></h2>
          <span class="badge" id="lineCount"></span>
        </div>

        <div class="button-row">
          <button class="btn btn-secondary" id="fileBtn">
            <i class="mdi mdi-file-document-outline"></i>
            <span data-i18n="common.file"></span>
          </button>
          <button class="btn btn-secondary" id="pasteBtn">
            <i class="mdi mdi-clipboard-text-outline"></i>
            <span data-i18n="common.paste"></span>
          </button>
          <button class="btn btn-secondary" id="exportBtn">
            <i class="mdi mdi-download-outline"></i>
            <span data-i18n="subtitleModal.srt.export"></span>
          </button>
        </div>

        <div class="input-wrap">
          <textarea
            id="srtInput"
            data-i18n-placeholder="subtitleModal.srt.placeholder"
            spellcheck="false"
          ></textarea>
          <button
            class="clear-btn hidden"
            id="clearInputBtn"
            data-i18n-title="common.clear"
          >
            <i class="mdi mdi-close-circle"></i>
          </button>
        </div>

        <div class="meta hidden" id="subtitleInfo">
          <i class="mdi mdi-check-circle"></i>
          <span id="subtitleCount"></span>
          <span class="dot">•</span>
          <span id="charCount"></span>
        </div>

        <button class="btn btn-primary" id="applyBtn" disabled>
          <i class="mdi mdi-subtitles"></i>
          <span data-i18n="subtitleModal.srt.load"></span>
        </button>

        <p class="hint" data-i18n="extension.popup.srtHint"></p>
      </main>

      <div class="toast hidden" id="toast">
        <span id="toastMessage"></span>
      </div>
    </div>

    <input type="file" id="fileInput" accept=".srt,.txt,text/plain" hidden />
    <script src="dist/popup/index.js" type="module"></script>
  </body>
</html>
